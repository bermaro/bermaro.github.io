<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Comic-Scanner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comics">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f2f4f8; color: #1d2733; }
  .lade { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center; }
  .kreis { width: 42px; height: 42px; border: 4px solid #d6dde8; border-top-color: #1f3a5f; border-radius: 50%; animation: drehen 1s linear infinite; }
  @keyframes drehen { to { transform: rotate(360deg); } }
  button { font-size: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: #1f3a5f; color: #fff; }
</style>
</head>
<body>
<!--
  Comic-Scanner – Startseite auf GitHub Pages
  Diese kleine Seite holt die eigentliche App aus dem Google-Skript (ohne Google-Anmeldung)
  und merkt sie sich auf dem Gerät. Ab dem zweiten Öffnen startet die App sofort aus dem
  Speicher; im Hintergrund wird die neueste Fassung für das nächste Öffnen geholt.
  Die Daten selbst kommen aus Firebase und der Google-Tabelle. Ohne PIN kommt niemand an eine Sammlung.
  WICHTIG: Hier keine globalen Namen anlegen (alles steckt in einer Klammer-Funktion),
  sonst gibt es Namenskonflikte mit der geladenen App.
-->
<div class="lade" id="lade">
  <div style="font-size:48px">📚</div>
  <div class="kreis"></div>
  <div id="text">Comic-Scanner wird geladen …</div>
</div>
<script>
(function () {
  // Adresse der Google-Web-App (Comic-Scanner)
  var adresse = 'https://script.google.com/macros/s/AKfycbwlho_JTqSD5Wi21htidEj8wiJG2CLamkvDMlwva1TSPyRz4b82oV5MHX601NeHgVjC/exec';
  var SCHLUESSEL = 'comicScannerApp';

  var gespeichert = '';
  try { gespeichert = localStorage.getItem(SCHLUESSEL) || ''; } catch (e) { gespeichert = ''; }

  function zeigen(html) {
    document.open();
    document.write(html);
    document.close();
  }

  // Neueste Fassung holen und für das nächste Öffnen merken
  var holen = fetch(adresse + '?roh=1', { redirect: 'follow', cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('Fehler ' + r.status);
      return r.text();
    })
    .then(function (html) {
      if (html.indexOf('Comic-Scanner') < 0) throw new Error('Antwort unbekannt');
      try { localStorage.setItem(SCHLUESSEL, html); } catch (e) { /* Speicher voll – egal */ }
      return html;
    });

  if (gespeichert && gespeichert.indexOf('Comic-Scanner') >= 0) {
    // Sofort starten; die neue Fassung kommt beim nächsten Öffnen
    zeigen(gespeichert);
    holen.catch(function () { /* egal */ });
  } else {
    holen.then(zeigen).catch(function (e) {
      document.getElementById('lade').innerHTML =
        '<div style="font-size:48px">📚</div>' +
        '<div>Der Comic-Scanner konnte nicht geladen werden (' + e.message + ').<br>Bitte Internet prüfen.</div>' +
        '<button onclick="location.reload()">Nochmal versuchen</button>';
    });
  }
})();
</script>
</body>
</html>
